name: Lumen
options:
  bundleIdPrefix: app.lumen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Lumen/Library/Steam/Native/CArchive"
packages:
  Zstandard:
    url: https://github.com/facebook/zstd.git
    exactVersion: "1.5.7"
targets:
  Lumen:
    type: application
    platform: macOS
    sources:
      - path: Lumen
        excludes: [Library/Steam/Native/CArchive]
    dependencies:
      - package: Zstandard
        product: libzstd
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        NSAudioCaptureUsageDescription: Audio-reactive wallpapers follow the music your Mac plays. Lumen only measures loudness per frequency and never records or stores audio.
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: app.lumen.Lumen
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
  LumenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LumenTests
      # Compile the production parsers without starting the app or its desktop engine.
      - path: Lumen/Engine/LockScreen/AerialSystem.swift
      - path: Lumen/Engine/Scene/SceneAnimation.swift
      - path: Lumen/Engine/Scene/SceneDocument.swift
      - path: Lumen/Engine/Scene/SceneFileSystem.swift
      - path: Lumen/Engine/Scene/TexDecoder.swift
      - path: Lumen/Engine/Scene/Shaders/WEShaderPreprocessor.swift
      - path: Lumen/Library/WallpaperEngineProject.swift
      - path: Lumen/Library/Steam/SteamCMD.swift
      - path: Lumen/Library/Steam/Native
        excludes: [CArchive]
      - path: Lumen/Support/Support.swift
    dependencies:
      - package: Zstandard
        product: libzstd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  LumenTests:
    build:
      targets:
        LumenTests: [test]
    test:
      targets:
        - LumenTests
